[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-sec-platform"
version = "0.5.0"
description = "Security harness for Vibe Coding workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Vibe Sec Platform Maintainers"}
]
keywords = ["security", "vibe-coding", "ai-audit", "vulnerability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "setuptools>=61.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "openai>=1.3.0",
    "anthropic>=0.8.0",
    "httpx>=0.25.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "esprima>=4.0.1",
    "tree-sitter-language-pack==1.13.3",
]

[project.scripts]
vibe-sec = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/dxz0069/vibe-guard"
Repository = "https://github.com/dxz0069/vibe-guard"
Documentation = "https://github.com/dxz0069/vibe-guard#readme"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "tools*", "api*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:pytest_ethereum"
